# XcodeGen 설정. `brew install xcodegen && xcodegen` 으로 HockeyDiary.xcodeproj를 만든다.
# 맥 없이 GitHub Actions(macos-26)에서 빌드한다 — docs/RELEASE_FROM_LINUX.md 참고.
name: HockeyDiary
options:
  bundleIdPrefix: com.aspynlim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 6 컴파일러에서도 Swift 5 언어 모드로 빌드
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 팀 ID는 CI에서 환경 변수(TEAM_ID)로 넣는다.
    DEVELOPMENT_TEAM: "${TEAM_ID}"

packages:
  HockeyCore:
    path: HockeyCore

targets:
  HockeyDiary:
    type: application
    platform: iOS
    sources:
      - path: HockeyDiary
      - path: Shared
    dependencies:
      - package: HockeyCore
      - target: HockeyDiaryWatch
      - target: HockeyDiaryWidgets
    entitlements:
      path: HockeyDiary/HockeyDiary.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # 위젯과 숫자를 나누는 키체인 그룹(앱 그룹 대신, 포털 설정 없이 됨).
        keychain-access-groups: ["$(AppIdentifierPrefix)com.aspynlim.hockeydiary.shared"]
    info:
      path: HockeyDiary/Info.plist
      properties:
        CFBundleDisplayName: 마하다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # 루틴 러너를 잠금 화면·다이내믹 아일랜드에 띄운다.
        NSSupportsLiveActivities: true
        # 시즌 리포트 이미지를 공유 시트에서 '이미지 저장'할 때 필요(없으면 저장 순간 앱이 꺼진다).
        NSPhotoLibraryAddUsageDescription: "시즌 리포트 이미지를 사진첩에 저장할 때 써. 다른 사진은 보지 않아."
        NSHealthShareUsageDescription: "하키 전날 잠, 수업·경기 중 심박, 워치·가민이 잰 운동을 내 기록 옆에 보여줄게. 읽기만 하고 어디에도 안 보내."
        # 쓰지 않지만 HealthKit 권한이 있으면 Apple이 쓰기 설명도 요구한다(없으면 업로드 거절).
        NSHealthUpdateUsageDescription: "워치로 잰 하키 운동을 건강 앱에 저장해. 그 밖의 건강 데이터는 건드리지 않아."
        # 사진은 PhotosPicker(시스템 선택기)로만 받아 앨범 전체 권한을 요청하지 않는다 (FR-08, T10).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.hockeydiary
        PRODUCT_NAME: HockeyDiary
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"   # iPhone 전용
        # AI 요약용 FoundationModels는 iOS 26에만 있다. iOS 17·18에서 앱이 켜지자마자 꺼지지 않게 선택 연결.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        # 출시 빌드는 수동 서명. 서명 설정을 앱 타깃에만 두어야 SPM 패키지 타깃 빌드가 깨지지 않는다.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "${PROFILE_NAME}"

  # Apple Watch 앱. 하키 운동 세션으로 시간·심박을 재고, 끝난 활동을 WatchConnectivity로 아이폰에 보낸다.
  HockeyDiaryWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HockeyDiaryWatch
      - path: Shared/MoodFace.swift
      - path: Shared/MahadaIcons.swift
      - path: Shared/MahadaIconData.swift
    dependencies:
      - package: HockeyCore
    entitlements:
      path: HockeyDiaryWatch/HockeyDiaryWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: HockeyDiaryWatch/Info.plist
      properties:
        CFBundleDisplayName: 마하다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.aspynlim.hockeydiary
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "하키 하는 동안 심박을 보여줄게. 어디에도 안 보내."
        NSHealthUpdateUsageDescription: "워치로 잰 하키 운동을 건강 앱에 저장해."
        NSLocationWhenInUseUsageDescription: "야외 링크나 폰드에서 탈 때 총거리만 재. 어디를 지났는지는 남기지 않아."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.hockeydiary.watchkitapp
        PRODUCT_NAME: HockeyDiaryWatch
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "${WATCH_PROFILE_NAME}"

  # 홈·잠금 화면 위젯 + 루틴 실시간 활동. 앱이 키체인 공유 그룹에 둔 숫자만 읽는다.
  HockeyDiaryWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HockeyDiaryWidgets
      - path: Shared
    entitlements:
      path: HockeyDiaryWidgets/HockeyDiaryWidgets.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.aspynlim.hockeydiary.shared"]
    info:
      path: HockeyDiaryWidgets/Info.plist
      properties:
        CFBundleDisplayName: 마하다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.hockeydiary.widgets
        PRODUCT_NAME: HockeyDiaryWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "${WIDGET_PROFILE_NAME}"

  # 앱 저장소 통합 테스트(메모리 SwiftData). build-check에서 시뮬레이터로 실행한다.
  HockeyDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HockeyDiaryTests
    dependencies:
      - target: HockeyDiary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.hockeydiary.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HockeyDiary.app/HockeyDiary
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1"

  # 화면 점검(E2E): 예시 데이터로 앱을 띄워 주요 화면 스크린샷을 남긴다 (.github/workflows/ui-screens.yml).
  HockeyDiaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HockeyDiaryUITests
    dependencies:
      - target: HockeyDiary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.hockeydiary.uitests
        TEST_TARGET_NAME: HockeyDiary
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  HockeyDiary:
    build:
      targets:
        HockeyDiary: all
    test:
      config: Debug
      targets:
        - HockeyDiaryTests
        - HockeyDiaryUITests
    run:
      config: Debug
    archive:
      config: Release
