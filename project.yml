# XcodeGen 설정. `brew install xcodegen && xcodegen` 으로 HockeyDiary.xcodeproj를 만든다.
# 맥 없이 GitHub Actions(macos-26)에서 빌드한다 — docs/RELEASE_FROM_LINUX.md 참고.
name: HockeyDiary
options:
  bundleIdPrefix: com.aspynlim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 6 컴파일러에서도 Swift 5 언어 모드로 빌드
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 팀 ID는 CI에서 환경 변수(TEAM_ID)로 넣는다.
    DEVELOPMENT_TEAM: "${TEAM_ID}"

packages:
  HockeyCore:
    path: HockeyCore

targets:
  HockeyDiary:
    type: application
    platform: iOS
    sources:
      - path: HockeyDiary
    dependencies:
      - package: HockeyCore
    entitlements:
      path: HockeyDiary/HockeyDiary.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: HockeyDiary/Info.plist
      properties:
        CFBundleDisplayName: 마하다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # 시즌 리포트 이미지를 공유 시트에서 '이미지 저장'할 때 필요(없으면 저장 순간 앱이 꺼진다).
        NSPhotoLibraryAddUsageDescription: "시즌 리포트 이미지를 사진첩에 저장하려고 써. 사진첩의 다른 사진은 읽지 않아."
        NSHealthShareUsageDescription: "하키 전날 밤 수면, 수업·경기 시간대 심박, 워치·가민이 잰 운동을 내 기록 옆에 보여주려고 읽어. 읽기만 하고 앱 밖으로 보내지 않아."
        # 쓰지 않지만 HealthKit 권한이 있으면 Apple이 쓰기 설명도 요구한다(없으면 업로드 거절).
        NSHealthUpdateUsageDescription: "마하다는 건강 앱에 데이터를 쓰지 않아. 수면·심박·운동을 읽기만 해."
        # 사진은 PhotosPicker(시스템 선택기)로만 받아 앨범 전체 권한을 요청하지 않는다 (FR-08, T10).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.hockeydiary
        PRODUCT_NAME: HockeyDiary
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"   # iPhone 전용
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        # 출시 빌드는 수동 서명. 서명 설정을 앱 타깃에만 두어야 SPM 패키지 타깃 빌드가 깨지지 않는다.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "${PROFILE_NAME}"

  # 앱 저장소 통합 테스트(메모리 SwiftData). build-check에서 시뮬레이터로 실행한다.
  HockeyDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HockeyDiaryTests
    dependencies:
      - target: HockeyDiary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aspynlim.hockeydiary.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HockeyDiary.app/HockeyDiary
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  HockeyDiary:
    build:
      targets:
        HockeyDiary: all
    test:
      config: Debug
      targets:
        - HockeyDiaryTests
    run:
      config: Debug
    archive:
      config: Release
